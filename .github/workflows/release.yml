name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: >-
          dotnet publish TopMostFriend/TopMostFriend.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/${{ matrix.runtime }}

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packages | Out-Null
          Compress-Archive -Path "publish/${{ matrix.runtime }}/TopMostFriend.exe" -DestinationPath "packages/TopMostFriend-${{ matrix.runtime }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.runtime }}
          path: packages/*.zip

  release:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: packages

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" packages/*.zip --generate-notes --title "TopMostFriend ${{ github.ref_name }}"
